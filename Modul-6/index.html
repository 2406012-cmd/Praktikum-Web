<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 6 - Api</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Daftar Pengguna</h2>
        <p class="subtitle">Praktikum Asynchronus Javascript dan Fetching API</p>
    </div>

    <!-- Tombol Aksi-->
     <div class="actions bar">
        <button class="btn-primary" id="btnFetch">Muat Data Pengguna</button>
     </div>

     <!-- Indikator Status Loading dan Pesan Error -->
      <div class="status-msg" id="statusMessage">
        Klik tombol Di atas Untuk memuat Data Pengguna
      </div>

      <!-- Container Card Pengguna -->
       <div class="user-grid" id="userList"></div>
</body>
</html>
