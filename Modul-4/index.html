<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Portofolio Proyek - Modul 4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; padding: 30px 15px; }
    .container { max-width: 800px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    
    h1 { color: #1e3a8a; font-size: 24px; margin-bottom: 5px; }
    p.subtitle { color: #64748b; margin-bottom: 20px; font-size: 14px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; text-align: center; }
    .stat-card h3 { font-size: 13px; color: #64748b; text-transform: uppercase; margin-bottom: 5px; }
    .stat-card p { font-size: 20px; font-weight: bold; color: #1e3a8a; }

    .form-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 25px; }
    .form-card h3 { font-size: 16px; color: #1e3a8a; margin-bottom: 15px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #475569; }
    .form-control { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    .form-checkbox { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; color: #334155; }
    .btn-primary { background: #1e3a8a; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.2s; }
    .btn-primary:hover { background: #1e40af; }

    .controls-grid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
    .search-input { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; min-width: 250px; flex: 1; }
    .filter-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-filter { padding: 8px 14px; border: 1px solid #cbd5e1; background: #ffffff; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.2s; }
    .btn-filter.active, .btn-filter:hover { background: #1e3a8a; color: #ffffff; border-color: #1e3a8a; }

    .project-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background: #ffffff; transition: transform 0.15s ease; }
    .project-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .project-info h4 { font-size: 16px; color: #0f172a; margin-bottom: 4px; }
    .project-category { display: inline-block; font-size: 12px; color: #0284c7; background: #e0f2fe; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; font-weight: 600; }
    .project-budget { font-size: 14px; color: #334155; font-weight: 600; }
    
    .project-actions { display: flex; align-items: center; gap: 10px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-pending { background: #fef9c3; color: #854d0e; }
    .btn-action { padding: 6px 10px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .btn-action:hover { background: #f1f5f9; }
    .btn-delete { color: #dc2626; border-color: #fca5a5; }
    .btn-delete:hover { background: #fee2e2; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Portofolio Proyek Interaktif</h1>
      <p class="subtitle">Modul : Portfolio Tracker</p>
    </header>

    <!-- Kartu Ringkasan Statistik -->
    <section class="stats-grid">
      <div class="stat-card">
        <h3>Total Proyek</h3>
        <p id="stat-total-projects">0</p>
      </div>
      <div class="stat-card">
        <h3>Total Anggaran</h3>
        <p id="stat-total-budget">Rp 0</p>
      </div>
      <div class="stat-card">
        <h3>Selesai Dikerjakan</h3>
        <p id="stat-completed-projects">0</p>
      </div>
    </section>

    <!-- Formulir Tambah Proyek Baru -->
    <section class="form-card">
      <h3>+ Tambah Proyek Baru</h3>
      <form id="project-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="title">Judul Proyek</label>
            <input type="text" id="title" class="form-control" placeholder="Misalnya: Sistem...." required>
          </div>
          <div class="form-group">
            <label for="category">Kategori</label>
            <select id="category" class="form-control" required>
              <option value="Web App">Web App</option>
              <option value="Desktop App">Desktop App</option>
              <option value="Mobile App">Mobile App</option>
            </select>
          </div>
          <div class="form-group">
            <label for="budget">Estimasi Anggaran (Rp)</label>
            <input type="number" id="budget" class="form-control" placeholder="1000000" min="1" required>
          </div>
        </div>
        <div class="form-checkbox">
          <input type="checkbox" id="completed">
          <label for="completed">Tandai Sudah Selesai</label>
        </div>
        <button type="submit" class="btn-primary" style="margin-top: 15px;">Simpan Proyek</button>
      </form>
    </section>

    <!-- Kontrol Pencarian & Filter Kategori -->
    <div class="controls-grid">
      <input type="text" id="search-input" class="search-input" placeholder="Cari nama proyek...">
      <nav class="filter-group">
        <button class="btn-filter active" data-category="Semua">Semua</button>
        <button class="btn-filter" data-category="Web App">Web App</button>
        <button class="btn-filter" data-category="Desktop App">Desktop App</button>
        <button class="btn-filter" data-category="Mobile App">Mobile App</button>
      </nav>
    </div>

    <!-- Kontainer Daftar Proyek -->
    <main id="project-list"></main>
  </div>

  <script src="main.js"></script>
</body>
</html>
